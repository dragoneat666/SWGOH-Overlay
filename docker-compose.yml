# Builds the image from this checkout. For Dockge / pulling the published
# image instead, use docker-compose.ghcr.yml.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted, unofficial-but-unauthenticated bridge to SWGoH's own game
  # API. No account credentials required - see docs/ARCHITECTURE.md.
  comlink:
    image: ghcr.io/swgoh-utils/swgoh-comlink:latest
    restart: unless-stopped
    environment:
      APP_NAME: ${COMLINK_APP_NAME:-swgoh-overlay}

  # API + web admin UI (http://<server>:${API_PORT}/)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_TOKEN: ${API_TOKEN}
      COMLINK_URL: ${COMLINK_URL:-http://comlink:3000}
      PORT: 4001
    ports:
      - "${API_PORT:-4001}:4001"
    volumes:
      - uploads-data:/app/uploads

volumes:
  db-data:
  uploads-data:
